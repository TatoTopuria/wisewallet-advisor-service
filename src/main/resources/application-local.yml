spring:
  datasource:
    url: jdbc:postgresql://localhost:5435/wisewallet_advisor
    username: postgres
    password: ${DB_PASSWORD:dev_password}
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379

wisewallet:
  internal:
    jwt:
      secret: ${INTERNAL_JWT_SECRET:local-dev-internal-jwt-secret-needs-32chars!}
  advisor:
    account-service-url: http://localhost:8081

logging:
  level:
    com.wisewallet: DEBUG
